name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write      # for the build provenance attestation
  attestations: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --configuration Release
      - name: Publish (win-x64, self-contained, ReadyToRun)
        run: dotnet publish src/Sss.Web -c Release -r win-x64 --self-contained -p:PublishReadyToRun=true -p:Version="${GITHUB_REF_NAME#v}" -o "dist/sss/app"
      - name: Package
        run: |
          cp scripts/install.ps1 scripts/Install-SssJea.ps1 scripts/Test-SssSetup.ps1 scripts/Test-SssCitrix.ps1 scripts/Test-SssCloud.ps1 scripts/Sync-SssConfig.ps1 scripts/Test-SssConfig.ps1 scripts/Register-SssShadow.ps1 scripts/Start-SssShadow.ps1 LICENSE README.md README.de.md dist/sss/
          cp -r docs dist/sss/docs
          (cd dist && zip -qr "../sss-${GITHUB_REF_NAME}-win-x64.zip" sss)
          sha256sum "sss-${GITHUB_REF_NAME}-win-x64.zip" > "sss-${GITHUB_REF_NAME}-win-x64.zip.sha256"
      - name: Attest build provenance
        continue-on-error: true   # a failing attestation must not block the release; check the run for a warning
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: sss-${{ github.ref_name }}-win-x64.zip
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "sss-${GITHUB_REF_NAME}-win-x64.zip" "sss-${GITHUB_REF_NAME}-win-x64.zip.sha256" --title "SSS ${GITHUB_REF_NAME}" --generate-notes $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
