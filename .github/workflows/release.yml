name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - run: dotnet test --configuration Release
      - name: Publish (win-x64, self-contained, ReadyToRun)
        run: dotnet publish src/Sss.Web -c Release -r win-x64 --self-contained -p:PublishReadyToRun=true -p:Version="${GITHUB_REF_NAME#v}" -o "dist/sss/app"
      - name: Package
        run: |
          cp scripts/install.ps1 scripts/Install-SssJea.ps1 scripts/Test-SssSetup.ps1 scripts/Test-SssCitrix.ps1 LICENSE README.md README.de.md dist/sss/
          cp -r docs dist/sss/docs
          (cd dist && zip -qr "../sss-${GITHUB_REF_NAME}-win-x64.zip" sss)
          sha256sum "sss-${GITHUB_REF_NAME}-win-x64.zip" > "sss-${GITHUB_REF_NAME}-win-x64.zip.sha256"
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "sss-${GITHUB_REF_NAME}-win-x64.zip" "sss-${GITHUB_REF_NAME}-win-x64.zip.sha256" --title "SSS ${GITHUB_REF_NAME}" --generate-notes $([[ "$GITHUB_REF_NAME" == *-* ]] && echo --prerelease)
